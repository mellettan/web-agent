[project]
name = "web-agent"
version = "0.2.0"
description = "AI-агент, который управляет браузером через function calling, плюс MCP-сервер с инструментами браузера"
readme = "README.md"
authors = [{ name = "Roman Medvedev", email = "roma23470@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "openai>=2.4.0,<3",
    "playwright>=1.55.0,<2",
    "pydantic>=2.12.2,<3",
    "pydantic-settings>=2.11.0,<3",
    "tiktoken>=0.12.0,<0.13",
    "loguru>=0.7.3,<0.8",
    "mcp>=1.17.0,<2",
]

[project.scripts]
web-agent = "web_agent.__main__:main"
web-agent-mcp = "web_agent.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: тесты с настоящим Chromium (нужен `playwright install chromium`)"]
